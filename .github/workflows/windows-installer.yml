name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [codex/triviathon-windows-installer]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: rustup update stable --no-self-update
      - run: npm run desktop:build -- --ci -- --locked
      - name: Verify packaged audio and install for the current user
        shell: pwsh
        run: |
          $expected = @('boardFill.mp3', 'buzzer-ding.mp3', 'correctAnswer.mp3', 'dailyDouble.mp3', 'incorrectAnswer.mp3', 'timesUp.mp3')
          $audio = @(Get-ChildItem dist-desktop -Recurse -File -Filter '*.mp3' | ForEach-Object Name)
          if (Compare-Object $expected $audio) { throw 'Unexpected desktop audio assets' }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows x64 installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'Triviathon'
          $install = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)" }
          $installed = Get-Item (Join-Path $installDir 'triviathon.exe')
          if ($installed.VersionInfo.ProductName -ne 'Triviathon') { throw 'Unexpected installed product' }
          Get-FileHash $installed.FullName, $installer.FullName | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Triviathon-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
